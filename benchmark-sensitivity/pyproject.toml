[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-sensitivity"
version = "0.1.0"
description = "Diagnostics for disparity estimates that depend on an unobservable benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vivian Chan" }]
keywords = ["fairness", "conformal-prediction", "housing", "valuation", "robustness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bsr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
